      <!-- GALERIE
           ───────────────────────────────────────────────
           POUR AJOUTER UNE TOILE :
           1. Dépose l'image (.webp, ~1600 px de large) dans assets/galerie/
           2. Copie le bloc <figure> ci-dessous, colle-le dans la galerie
              (en haut = affichée en premier), puis change :
              le nom du fichier, width/height (dimensions réelles de
              l'image), et le texte de la légende.
           3. Supprime ensuite la ligne « gallery-empty ».
           La légende est facultative : supprime <figcaption>…</figcaption>
           si tu n'en veux pas.

           <figure class="gallery-item">
             <img src="assets/galerie/nom-de-la-toile.webp"
                  alt="Titre de la toile"
                  width="1600" height="2000"
                  loading="lazy" decoding="async">
             <figcaption class="mono">
               <span>TITRE</span>
               <span>HUILE SUR TOILE / 2025</span>
             </figcaption>
           </figure>
           ─────────────────────────────────────────────── -->

      <section class="gallery-grid">
